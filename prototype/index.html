  catch (_) { audioContext = null; generatorHum = generatorHumGain = null; humMode = ''; }

function syncGeneratorHum() {
  if (!audioContext || audioContext.state !== 'running' || !soundEnabled || document.hidden) return;

  const powered = gens.filter(t => !isDrained(t)).length, drained = gens.length - powered;

    if (!generatorHum) {

}
function playCue(kind, frequency, duration, wave = 'sine', endFrequency = frequency, interval = 0.045) {

    gain.gain.setValueAtTime(0.0001, now); gain.gain.exponentialRampToValueAtTime(0.055, now + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

    osc.onended = () => { activeVoices = Math.max(0, activeVoices - 1); try { osc.disconnect(); gain.disconnect(); } catch (_) {} };
    activeVoices++; reserved = true; osc.start(now); osc.stop(now + duration + 0.01);

function waveDef(n) {

    for (let i = 0; i < st.bomblets; i++) {

    }

function fireElectro(t, st, target) {
  // The bolt is a line: a Carapacid in the way intercepts it and takes the hit; the chain continues from the body actually struck.
  let hit = target, bestU = 2;
  if (!target.T.air) for (const c of S.enemies) {              // a flying target is above the shadow
    if (c.dead || c === target || c.type !== 'carapacid') continue;
    const u = segHitsCircle(t.x, t.y, target.x, target.y, c.x, c.y, c.r + 3);

    S.shots.push({x1:from.x, y1:from.y, x2:cur.x, y2:cur.y, life:0.12, electro:true, blocked: hop === 0 && hit !== target, from:hop ? struck[hop-1] : null, to:cur});

      S.fx.push({kind:'spark', x:cur.x, y:cur.y, r:cur.r + 6, life:0.3, max:0.3, color:'#e0a060'});
      break;
    }
    from = cur; dmg *= (st.falloff || t.T.hopFalloff); let next = null, best = Infinity;
    for (const e of S.enemies) {                                // nearest living body not yet struck, with no lethal charge already reserved
      if (e.dead || e.submerged || struck.includes(e) || e.hp - e.incoming <= 0) continue;   // hops follow the same anti-overkill rule as every first shot; nothing beneath the ooze
      const d = Math.hypot(e.x - cur.x, e.y - cur.y);

}
// The Flamethrower sweeps a jet of burning fuel across a quarter circle (±45° around its target). Every body the jet touches

function fireFlame(t, st, target) {
  const aim = Math.atan2(target.y - t.y, target.x - t.x);
  const a = aim + T_SWEEP(t) * Math.sin(S.time * 3.2 + SLOTS.indexOf(t.slot));
  t.angle = a; t.jetAt = S.time;                                // presentation: the drawn jet follows the sweep
  const tx = t.x + Math.cos(a) * st.range, ty = t.y + Math.sin(a) * st.range;
  const hits = [];
  for (const e of S.enemies) { if (e.dead || e.T.air) continue; const u = segHitsCircle(t.x, t.y, tx, ty, e.x, e.y, 10 + e.r * 0.5); if (u >= 0) hits.push([u, e]); }
  hits.sort((p, q) => p[0] - q[0]);

  for (const [, e] of hits) {
    const pass = shield && e.type !== 'carapacid' ? FLAME_SHADOW_PASS : 1;
    if (e.submerged) { damage(e, st.dmg * pass * LEECH_OOZE.collateral, t); continue; }   // v0.11: the jet only warms the ooze; no burn, no slow
    damage(e, st.dmg * pass, t);

      if (pools.length >= st.pools) S.pools = S.pools.filter(q => q !== pools[0]);

}
function T_SWEEP(t) { return t.T.sweep || 0; }

// ---------------------------------------------------------------- update
function update(dt) {
  if(['finished','verified','error'].includes(replay.mode)) return;
  S.accumulator += dt;
  const ticks = Math.floor((S.accumulator + 1e-9) / SIM_STEP);
  S.accumulator = Math.max(0, S.accumulator - ticks * SIM_STEP);
  for (let i = 0; i < ticks; i++) {
    const oldPhase=S.phase;
    stepSimulation(SIM_STEP);
    if(replay.mode==='recording'){
      replay.tick++;
      if(oldPhase==='wave'&&S.phase!=='wave') replay.checkpoints.push({tick:replay.tick,signature:replaySignature()});
      if(S.phase==='over'){
        const signature=replaySignature(); replay.terminal={tick:replay.tick,win:!!S.win,signature}; replay.mode='finished';
      }
      if(replay.mode==='finished') break;
    }
  }
}
// Shells in flight keep flying in any phase: a shell fired at the last body of a wave must still land after that body
// has left the field, instead of hanging in the air until the next wave.
function advanceShells(dt) {
  for (const sh of S.shells) {
    sh.t += dt;
    if (sh.t >= sh.flight) {
      sh.done = true;
      if (sh.prime) sh.prime.incoming = Math.max(0, sh.prime.incoming - sh.dmg);   // ledger settles on impact
      for (const e of S.enemies) if (!e.dead && !e.T.air && Math.hypot(e.x-sh.tx, e.y-sh.ty) <= sh.splash + e.r*0.5) damage(e, sh.dmg * (e.submerged ? LEECH_OOZE.collateral : 1), sh.tower);   // v0.11: the blast bleeds through the ooze
      S.fx.push({kind:'boom', x:sh.tx, y:sh.ty, r:sh.splash, life:0.35, max:0.35, color:'#ffae42'});
      if (sh.cluster) for (let j = 0; j < 3; j++) {                 // three fragments per bomblet strike inside its blast area
        const a = sh.cluster.i * 1.3 + j * 2.094, rr = sh.splash * (0.3 + 0.25 * j);
        S.fx.push({kind:'frag', x:sh.tx + Math.cos(a)*rr, y:sh.ty + Math.sin(a)*rr, r:3, life:0.3, max:0.3, color:'#ffd27f'});
      }
      presentationBursts.push({kind:'impactDust', x:sh.tx, y:sh.ty, at:presentationTime, life:0.34});
      if (presentationBursts.length > 18) presentationBursts.shift();
      playCue('impact', 118, 0.12, 'triangle');
    }
  }
  S.shells = S.shells.filter(s => !s.done);
}
function stepSimulation(dt) {
  S.time += dt;
  if (S.toastT > 0) S.toastT -= dt;
  for (const s of S.shots) s.life -= dt; S.shots = S.shots.filter(s => s.life > 0);
  for (const f of S.fx) f.life -= dt;    S.fx = S.fx.filter(f => f.life > 0);
  if (S.phase === 'build') { S.buildTimer -= dt; if (S.buildTimer <= 0) startWave(); }
  for (const t of S.towers) if (t.warm > 0) t.warm -= dt;
  for (const t of [...S.towers]) if (t.selling) { t.sellT -= dt; if (t.sellT <= 0) finishSell(t); }  // demolition runs in any phase
  if (INFANTRY_TRIAL && S.phase === 'build') updateInfantry(dt, power().brown);
  if (S.phase !== 'wave') { advanceShells(dt); return; }

  // spawning
  const newest = S.streams[S.streams.length-1];
  if (newest && newest.queue !== S.spawnQueue) newest.queue = S.spawnQueue;   // a tool or test replaced the newest queue
  for (const st of S.streams) if (st.queue.length) {
    st.timer -= dt;
    if (st.timer <= 0) { const s = st.queue.shift(); S.spawnedThisWave = st.spawned; const e = makeEnemy(s.type, st.wave); st.spawned = S.spawnedThisWave; e.seq = st.spawned - 1;
      e.wave = st.wave; S.enemies.push(e); st.timer = s.delay; }
  }
  hatchZygotes(dt);
  const infantryBrown = power().brown;
  updateInfantry(dt, infantryBrown);
  // enemies
  const feastMul = 1 + 0.08 * S.feast;                          // FEAST: the whole swarm quickens
  planCarapacidShelter(dt,feastMul);
  for (const e of S.enemies) {
    if (e.dead) continue;
    if (e.type === 'leech') {
      // Prototype exception to lane movement: hunt the nearest unclaimed generator anywhere.
      if (!e.sated && (e.state === 'lane' || e.state === 'return')) {
        let nearest = null, distance = Infinity;
        for (const t of S.towers) {
          if (t.type !== 'generator' || t.leeched || t.selling) continue;
          const candidateDistance = Math.hypot(t.x-e.x, t.y-e.y);
          if (candidateDistance < distance) { nearest = t; distance = candidateDistance; }
        }
        if (nearest) { e.state = 'seek'; e.gen = nearest; nearest.leeched = e; e.route = leechRoute(e, nearest);
          if (LEECH_OOZE) { e.submerged = true; playCue('dive', 110, 0.22, 'sine'); } }   // v0.11: the hunt begins beneath the ooze
      }
      if (e.state !== 'lane' && e.blockedBy) { e.blockedBy.target = null; e.blockedBy = null; }
      if (e.state === 'lane') {
        let sp = e.speed * feastMul; e.effSpeed = sp;
        e.resumeSpeed = sp;
        if (e.blockedBy) sp = 0;
        const prevD = e.d, nextD = e.d + sp * dt;
        if (!e.blockedBy) { const contact = e.T.air ? null : infantryContact(e, prevD, nextD); if (contact) { e.d = contact.d; e.blockedBy = contact.s; contact.s.target = e; sp = 0; } else e.d = nextD; }
        e.effSpeed = sp;
        const p = posAt(e.d); e.x = p.x; e.y = p.y;
        if (e.d >= GATE_D) { e.dead = true; S.gate -= e.T.gateDmg; S.waveLeaked++; playCue('gate', 72, 0.34, 'sawtooth');
          S.fx.push({kind:'leak', x:GATE.x, y:GATE.y, r:30, life:0.4, max:0.4, color:'#ff3b3b'}); }
      } else if (e.state === 'seek') {
        const L = Math.hypot(e.gen.x - e.x, e.gen.y - e.y);
        if (e.submerged && L <= LEECH_OOZE.surfaceDist) {       // v0.11: surface short of the generator, stand still, take full damage
          e.submerged = false; e.state = 'surfacing'; e.surfaceT = BUILD_WARMUP_SECONDS; playCue('surface', 180, 0.3, 'triangle');
        } else if (L < 20) { e.state = 'attached'; e.feedT = 0; playCue('drain', 145, 0.28, 'triangle'); }
        else {
          let step = e.speed * feastMul * dt;
          while (step > 0 && e.route.length) {                  // walk the planned bends; the last point is the generator
            const w = e.route[0], dx = w.x - e.x, dy = w.y - e.y, d = Math.hypot(dx, dy);
            if (d <= step) { e.x = w.x; e.y = w.y; step -= d; if (e.route.length > 1) e.route.shift(); else break; }
            else { e.x += dx/d * step; e.y += dy/d * step; step = 0; }
          }
        }
      } else if (e.state === 'surfacing') {                     // v0.11: no movement; the crawl resumes as an open seek
        e.surfaceT -= dt;
        if (e.surfaceT <= 0) { e.surfaceT = 0; e.state = 'seek'; }
      } else if (e.state === 'return') {
        const p = posAt(e.returnD), dx = p.x-e.x, dy = p.y-e.y, distance = Math.hypot(dx, dy);
        const step = e.speed * feastMul * dt;
        if (distance <= step) { e.x = p.x; e.y = p.y; e.d = e.returnD; e.state = 'lane'; }
        else { e.x += dx/distance * step; e.y += dy/distance * step; }
      } else {                                                  // attached: drains power, stacks FEAST
        e.feedT += dt; S.stolen += dt; e.fedTotal = (e.fedTotal || 0) + dt;
        if (e.feedT >= 3) { e.feedT = 0; if (S.feast < 3) { S.feast++; toast('THE SWARM FEASTS ×' + S.feast); } }
        if (e.fedTotal >= 10) {                                 // sated: detaches and crawls on (no immortal squatters)
          returnLeechToLane(e); e.sated = true; e.speed *= 1.3;
          playCue('recovery', 430, 0.2, 'sine');
        }
      }
      continue;
    }
    let sp = laneEffectiveSpeed(e, feastMul);
    if(e.shelter)sp=Math.min(sp,Math.max(0,(e.shelter.targetD-e.d)/dt));
    if (e.dash > 0) e.dash -= dt; // current tick uses dash before decrement; resume uses the remaining dash time
    e.resumeSpeed = laneEffectiveSpeed(e, feastMul);
    e.effSpeed = sp;
    if (e.blockedBy) sp = 0;
    const prevD = e.d, nextD = e.d + sp * dt;
    if (!e.blockedBy) { const contact = e.T.air ? null : infantryContact(e, prevD, nextD); if (contact) { e.d = contact.d; e.blockedBy = contact.s; contact.s.target = e; sp = 0; } else e.d = nextD; }
    e.effSpeed = sp;
    const p = posAt(e.d); e.x = p.x; e.y = p.y;
    if(e.type==='forager'&&!BALANCE_PRESET)shelterLanePosition(e,dt);
    if (e.d >= GATE_D) {
      e.dead = true;
      S.gate -= e.T.gateDmg; S.waveLeaked++; playCue('gate', 72, 0.34, 'sawtooth');
      S.fx.push({kind:'leak', x:GATE.x, y:GATE.y, r:30, life:0.4, max:0.4, color:'#ff3b3b'});
    }
  }
  resolveInfantryCombat(dt, infantryBrown);
  // towers
  const pw = power(); // account for attachment or detachment during this update
  for (const t of S.towers) {
    if (t.type === 'barracks') continue;
    if (t.type === 'generator' || t.paused || t.warm > 0 || t.selling) continue;
    const st = tstats(t);
    t.cd -= dt * (pw.brown ? BROWNOUT_MULT : 1) * (1 + 0.1 * rank(t));
    if (t.cd <= 0) {
      const tg = pickTarget(t, st);
      if (tg) { t.cd = st.interval; if (t.T.kind === 'flat') fireFlat(t, st, tg); else if (t.T.kind === 'electro') fireElectro(t, st, tg); else if (t.T.kind === 'fire') fireFlame(t, st, tg); else fireArc(t, st, tg); }
    }
  }
  // burning fuel and plasma pools
  for (const e of S.enemies) if (!e.dead && e.burnUntil > S.time) damage(e, e.burnDps * dt, e.burnTower);
  if (S.pools.length) {
    S.pools = S.pools.filter(q => q.until > S.time);
    for (const q of S.pools) for (const e of S.enemies) if (!e.dead && !e.T.air && Math.hypot(e.x - q.x, e.y - q.y) <= q.r + e.r * 0.5) damage(e, q.dps * dt * (e.submerged ? LEECH_OOZE.collateral : 1), q.tower);
  }
  advanceShells(dt);
  S.enemies = S.enemies.filter(e => !e.dead);
  if (S.births.length) { for (const b of S.births) S.enemies.push(b); S.births = []; }

  if (S.gate <= 0) { S.gate = 0; S.phase = 'over'; S.win = false; S.zygotes = []; return; }
  // A wave is complete when its stream has spawned everything and none of its bodies is alive (untagged bodies, placed
  // by tools or tests, hold every wave open). The field is clear when no stream and no body remains.
  for (const st of [...S.streams]) if (!st.queue.length && !S.enemies.some(e => e.wave === undefined || e.wave === st.wave) && !S.zygotes.some(z => z.wave === undefined || z.wave === st.wave)) {
    S.streams = S.streams.filter(x => x !== st);
    const live = S.streams[S.streams.length-1]; S.spawnQueue = live ? live.queue : [];   // S.spawnQueue always mirrors the newest live stream
    const fieldClear = !S.streams.length && !S.enemies.length && !S.zygotes.length;
    if (fieldClear) S.feast = 0;                                 // feast ends with the field
    endWave(st.wave, fieldClear);
    if (S.phase !== 'wave') return;
  }
  if (S.phase === 'wave' && !S.streams.length && !S.enemies.length && !S.zygotes.length && !S.spawnQueue.length) { S.feast = 0; endWave(S.wave, true); }
}

function observeMireTraffic(){

  mireTraffic=mireTraffic.filter(p=>presentationTime-p.at<1.35);
  for(const e of (S.enemies||[]).map(visualEnemy)){
    if(e.dead||!Number.isFinite(e.x)||!Number.isFinite(e.y))continue;
    const old=mireTrafficActors.get(simOf(e));
    if(!old){mireTrafficActors.set(simOf(e),{x:e.x,y:e.y});continue;}
    const travel=Math.hypot(e.x-old.x,e.y-old.y);
    if(travel>=4){
      const contacts=creatureMireReady(e)?creatureMireWorldContacts(e,creatureCrawlPose(e,enemyHeading(e))).map(p=>({x:p.x-(e.x-old.x),y:p.y-(e.y-old.y)})):null;
      mireTraffic.push({x:old.x,y:old.y,angle:Math.atan2(e.y-old.y,e.x-old.x),at:presentationTime,size:e.type==='carapacid'?9:5,contacts});
      old.x=e.x;old.y=e.y;

}
function drawLivingSurface(){
  const g=worldLiveArt.getContext('2d'),t=presentationTime;
  g.setTransform(WORLD_RASTER_SCALE,0,0,WORLD_RASTER_SCALE,0,0);
  g.clearRect(0,0,W,H);
  // The base texture is copied 1:1 every frame; motion exists only inside small contact patches.
  g.globalAlpha=1;g.drawImage(terrainArt,0,0,W,H);
  drawGroundLife(g,t);

    const life=Math.max(0,1-(t-p.at)/1.35);
    if(p.contacts){
      g.save();g.globalAlpha=life*.20;g.strokeStyle='#28180e';g.lineWidth=.8;
      for(const q of p.contacts){g.beginPath();g.ellipse(q.x,q.y,2.5+(1-life)*2,1+(1-life),0,.2,Math.PI*.8);g.stroke();}
      g.restore();continue;

    g.save();g.translate(p.x,p.y);g.rotate(p.angle);
    g.globalAlpha=life*.45;g.lineWidth=1.2;g.strokeStyle='#28180e';
    for(const side of [-1,1]){g.beginPath();g.moveTo(-3,side*p.size);g.quadraticCurveTo(0,side*(p.size+1.5),3,side*p.size);g.stroke();}
    g.globalAlpha=life*.22;g.strokeStyle=WORLD.wet;g.lineWidth=.65;
    g.beginPath();g.moveTo(-2,-p.size-1);g.lineTo(2,-p.size-1);g.stroke();g.restore();
  }
  for(const e of (S.enemies||[]).map(visualEnemy)){
    if(e.dead||!Number.isFinite(e.x)||!Number.isFinite(e.y))continue;
    const h=enemyHeading(e);
    if(creatureMireReady(e)){drawCreatureMireSurface(g,e,creatureCrawlPose(e,h));continue;}
    const pose=e.type==='forager'?foragerMirePose(e,h):null;
    const phase=pose?pose.distance*2*Math.PI/(FORAGER_MIRE.stride/FORAGER_MIRE.duty):creatureCrawlPose(e,h).distance*2*Math.PI/(e.type==='carapacid'?28:24);
    const a=Math.atan2(Math.sin(h)*.42,Math.cos(h));
    const size=e.type==='carapacid'?1.5:e.type==='leech'?1.1:1.5;

    g.drawImage(terrainArt,dx,dy,W,H);g.restore();
    g.save();g.translate(e.x,e.y+2);g.rotate(a);
    g.lineWidth=1.5;g.strokeStyle='#342214';g.globalAlpha=.55;
    const reach=17*size*Math.hypot(Math.cos(h),.42*Math.sin(h));
    g.beginPath();g.ellipse(0,0,reach,(4.2+Math.sin(phase)*.65)*size,0,-.40,.50);g.stroke();
    g.globalAlpha=.35;g.lineWidth=.65;g.strokeStyle='#c5a46c';
    g.beginPath();g.ellipse(0,-.3,reach+.25,(4.2+Math.sin(phase)*.65)*size,0,-.35,.4);g.stroke();g.restore();
  }
  g.globalAlpha=1;
  // Keep all supporting ground fixed, even when an enemy contact or trail crosses a footing.
  for(const b of groundFoundationRects()){
    const x=Math.max(0,b.x),y=Math.max(0,b.y),w=Math.min(W,b.x+b.w)-x,h=Math.min(H,b.y+b.h)-y;
    if(w>0&&h>0)g.drawImage(terrainArt,x*WORLD_RASTER_SCALE,y*WORLD_RASTER_SCALE,w*WORLD_RASTER_SCALE,h*WORLD_RASTER_SCALE,x,y,w,h);
  }
}

function foragerMireFeet(pose){
  const row=FORAGER_MIRE_CONTACTS[pose.direction],scale=FORAGER_MIRE.scale;
  return row[pose.frame].map(([x,y],i)=>{
    const ys=row.map(p=>p[i][1]),floor=Math.max(...ys),min=Math.min(...ys);

  });

function drawForagerBurial(e,pose){

  const rx=(8+12*Math.abs(Math.cos(pose.heading)))*1.5,ry=(7+8*Math.abs(Math.sin(pose.heading)))*1.4;

  text('Wave ' + S.wave + '/' + WAVES, 560, HUD/2, 14, '#e8ecf2', 'center', '700');
  if (BALANCE_PRESET) text('BALANCE: ' + BALANCE_PRESET.label, 560, HUD + 12, 11, '#ffb454', 'center', '700');
  if(['playing','verified','error'].includes(replay.mode)) btn(640,7,130,26,'Exit replay',()=>reset(),true,true);
  else if (S.phase === 'build') btn(640, 7, 130, 26, 'Send ' + Math.ceil(S.buildTimer) + 's  +' + Math.round(EARLY_CALL_BONUS*Math.max(0,S.buildTimer)), () => performPlayerAction({kind:'wave'}), true, true);
  else if (S.phase === 'wave' && S.wave < WAVES && replay.mode !== 'playing') {
    btn(640, 7, 130, 26, 'Next wave  +' + Math.round(EARLY_CALL_BONUS*BUILD_PAUSE), () => performPlayerAction({kind:'wave'}), true, !S.rushMutation);
    if (!S.rushMutation) text('rush: swarm gains a mutation', 705, HUD + 10, 9, '#ffb454', 'center', '600');
  }
  if ((S.phase === 'build' || S.phase === 'wave')&&replay.mode!=='playing'&&replay.mode!=='verified') btn(786, 7, 60, 26, '×' + S.speed, () => performPlayerAction({kind:'speed',value:S.speed===1?2:1}));
  text('Gate ' + S.gate, 954, HUD/2, 14, S.gate > 6 ? '#7cffb2' : '#ff6b6b', 'right', '700');
  if (INFANTRY_TRIAL && S.phase !== 'menu') {
    const soldiers=S.towers.filter(t=>t.type==='barracks'&&!t.selling).flatMap(t=>t.soldiers);
    text('INFANTRY '+soldiers.filter(s=>s.alive).length+'/'+soldiers.length+'  |  LOST '+S.infantryCasualties,W-14,H-BOT-9,10,'#c5d5b7','right','700');
  }

  // bottom bar: a fresh toast wins over the standing line
  let bottom = '';
  if (S.toastT > 0) bottom = S.toast;
  else if (S.phase === 'build') bottom = 'Next wave: ' + previewText(S.wave + 1) + (S.report ? '     |     ' + S.report : '');
  else if (S.phase === 'wave') bottom = 'Wave ' + S.wave + ' in progress. Towers aim themselves. Tap one to pause, upgrade or sell it.';
  if(pendingPlacement)bottom='Release to build. Slide away to cancel.';
  if(replay.mode==='error') bottom='REPLAY ERROR: '+replay.error+'  Use Exit replay to return to the menu.';
  wrappedText(bottom,14,H-BOT+10,W-28,2,S.toastT>0?'#ffe66d':'#c9d0dc');

  // Evolution is announced during the existing interwave build window; the card sits in unused lower-left terrain.
  if (S.phase === 'build' && S.report.startsWith('MEMORANDUM') && !evolutionCardDismissed) {
    const mutation = S.mutations[S.mutations.length - 1];
    const mutationNames = {keratin:'Keratinization', sprinter:'Sprinter Reflex', dispersal:'Dispersal', grounding:'Grounding'};
    const effect = {
      keratin:'Kinetic damage reduced by 30%.',
      sprinter:'New specimens accelerate at shell-whistle.',
      dispersal:'New specimens spread out; fewer share a blast.',
      grounding:'Rod specimens intercept lightning; the chain ends on them.'
    }[mutation] || 'New specimens carry an adaptation.';
    const x = 14, y = H - BOT - 63, w = 500, h = 56;
    ctx.fillStyle = '#111a1cf2'; ctx.strokeStyle = '#8b789d'; ctx.lineWidth = 1;
    roundRect(x, y, w, h, 4); ctx.fill(); ctx.stroke();
    // Same Forager body on both sides; the second specimen shows its mutation marker.
    evolutionBody(0, x + 23, y + 28, null);
    text('→', x + 46, y + 28, 13, '#c9d0dc', 'center', '700');
    evolutionBody(0, x + 67, y + 28, mutation);
    text('EVOLUTION  ' + (mutationNames[mutation] || 'Adaptation'), x + 88, y + 16, 10, '#e6d8f2', 'left', '700');
    text(effect, x + 88, y + 38, 10, '#d1d7df');
    if (mutation === 'grounding') {
      // A tiny animated chain ends at the copper-veined rod, matching the mutation's actual interaction.
      const pulse = (Math.sin(S.time * 8) + 1) * 0.5;
      ctx.strokeStyle = '#9df7ff'; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.45 + pulse * 0.55;
      ctx.beginPath(); ctx.moveTo(x+424,y+24); ctx.lineTo(x+442,y+31); ctx.stroke();
      ctx.globalAlpha = 1; ctx.strokeStyle = '#e0a060'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x+440,y+23); ctx.lineTo(x+445,y+29); ctx.lineTo(x+442,y+35); ctx.stroke();
    }
    btn(x + w - 25, y + 5, 20, 18, '×', () => { evolutionCardDismissed = true; });
  }

  // selection menus
  if (S.selected && !pendingPlacement && (S.phase === 'build' || S.phase === 'wave')) {
    if (S.selected.kind === 'slot') {
      const s = S.selected.slot; const items = ['turret', 'cannon', 'voltaic', 'flamer', 'generator'];
      if (INFANTRY_TRIAL) items.push('barracks');
      let x0 = Math.max(6, Math.min(W - 6 - items.length*98, s.x - items.length*49)); const y0 = s.y > H/2 ? s.y - 74 : s.y + 26;
      menuPanel(x0,y0,items.length);
        items.forEach((k, i) => { const T = TOWER[k];
        btn(x0 + i*98, y0, 92, 30, T.name + ' ' + T.cost, () => performPlayerAction({kind:'build',slot:SLOTS.indexOf(s),type:k}), S.credits >= T.cost);
        buttons[buttons.length-1].placement={slot:s,type:k}; });
      wrappedText('Turret: rapid fire. Cannon: arcing splash. Voltaic: chain lightning, jumps between bodies. Generator: +40 power, upgradable to +85.' + (INFANTRY_TRIAL ? ' Barracks: three automatic melee soldiers.' : ''),x0,y0+42,items.length*98-10);
    } else {
      const t = S.selected.tower; const st = tstats(t);
      const cols = t.type !== 'generator' && !t.selling && BRANCHES[t.type] && t.level === 3 ? 4 : 3;   // a level-3 tower shows two branch buttons
      let x0 = Math.max(6, Math.min(W - 6 - cols*98, t.x - cols*49)); const y0 = t.y > H/2 ? t.y - 74 : t.y + 26;
      menuPanel(x0,y0,cols);
      if (t.selling) {
        text('Demolition in progress…', x0, y0 + 10, 12, '#8a93a6', 'left');
      } else if (t.type !== 'generator') {
        const towerIndex=SLOTS.indexOf(t.slot), towerRef={slot:towerIndex,type:t.type,generation:replay.generations[towerIndex]};
        btn(x0, y0, 92, 30, t.paused ? 'Resume' : 'Pause', () => performPlayerAction({kind:t.paused?'resume':'pause',...towerRef}));
        const cost = t.T.upg[t.level], br = BRANCHES[t.type];
        if (br && t.level === 3) {                                // level 4: the upgrade button splits into the two branches
          btn(x0, y0, 92, 30, t.paused ? 'Resume' : 'Pause', () => performPlayerAction({kind:t.paused?'resume':'pause',...towerRef}));
          ['A','B'].forEach((k, i) => btn(x0 + 98*(1+i), y0, 92, 30, br[k].name + ' ' + br[k].cost, () => performPlayerAction({kind:'upgrade',...towerRef,branch:k}), S.credits >= br[k].cost));
          btn(x0 + 294, y0, 92, 30, 'Sell ' + Math.round(t.invested * SELL_RATE), () => performPlayerAction({kind:'sell',...towerRef}));
        } else {
        btn(x0 + 98, y0, 92, 30, t.type === 'barracks' ? 'No upgrade' : t.level < 3 ? 'Upgrade ' + cost : (t.branch && br ? br[t.branch].name : 'Max level'), () => performPlayerAction({kind:'upgrade',...towerRef}), t.type !== 'barracks' && t.level < 3 && S.credits >= cost);
        btn(x0 + 196, y0, 92, 30, 'Sell ' + Math.round(t.invested * SELL_RATE), () => performPlayerAction({kind:'sell',...towerRef}));
        }
        if (t.type === 'barracks') {
          const alive = t.soldiers.filter(soldier => soldier.alive).length;
          wrappedText('Barracks  ' + alive + '/3 soldiers ready. ' + (alive < 3 ? 'Casualties replaced between waves.' : 'Soldiers engage automatically.'), x0, y0 + 42, 288);
        } else wrappedText((t.branch && br ? br[t.branch].name : t.T.name) + ' L' + t.level + '  dmg ' + Math.round(st.dmg) + '  power ' + (t.paused ? Math.round(st.power*PAUSED_DRAW) : st.power) +
             '  kills ' + t.kills + (rank(t) ? (rank(t) === 2 ? '  Elite (stripes burn on sale)' : '  Veteran (stripes burn on sale)') : ''), x0, y0 + 42, 288);
      } else {
        const cost = t.T.upg[t.level];
        const towerIndex=SLOTS.indexOf(t.slot), towerRef={slot:towerIndex,type:t.type,generation:replay.generations[towerIndex]};
        btn(x0, y0, 92, 30, t.level < 3 ? 'Upgrade ' + cost : 'Max level', () => performPlayerAction({kind:'upgrade',...towerRef}), t.level < 3 && S.credits >= cost);
        btn(x0 + 98, y0, 92, 30, 'Sell ' + Math.round(t.invested * SELL_RATE), () => performPlayerAction({kind:'sell',...towerRef}));
        wrappedText(isDrained(t) ? 'Generator: LEECHED — output 0. Nearby towers are on it.'
                       : 'Generator L' + t.level + ': +' + GEN_POWER[t.level-1] + ' power' + (t.level < 3 ? ' (next +' + GEN_POWER[t.level] + ')' : '') + '. Cannot be paused.',
             x0, y0 + 42, 288);
      }
    }
  }

  // overlays
  if (S.phase === 'menu') {
    const shade=ctx.createLinearGradient(0,0,W,0);shade.addColorStop(0,'#071411fa');shade.addColorStop(.58,'#071411e8');shade.addColorStop(1,'#07141144');
    ctx.fillStyle=shade;ctx.fillRect(0,0,W,H);
    text('THE EXPEDITION  /  FIELD OPERATIONS',52,80,11,'#b8bd8b','left','700');
    text('THE HUNGER',48,139,56,'#e0e7cc','left','900');
    text('HOLD THE LINE. LEARN WHAT COMES NEXT.',52,185,12,'#9bac91','left','600');
    if (INFANTRY_TRIAL) text('FIELD TRIAL: INFANTRY — AUTOMATIC MELEE SUPPORT',52,204,10,'#b6d29e','left','700');
    ctx.fillStyle='#b9a866';ctx.fillRect(52,218,54,3);
    text('PERIMETER 07',52,256,22,'#d4dec4','left','700');
    text('Build your defense. Protect the generators.',52,291,15,'#afc1b2');
    text('The swarm adapts to your fire. Be ready to rebuild.',52,316,15,'#afc1b2');
    text('Tap a platform to build. Tap a tower to upgrade or sell.',52,351,12,'#8b9e91');
    btn(52,392,210,44,'DEPLOY GARRISON',()=>performPlayerAction({kind:'deploy'}),true,true);
    btn(52,444,130,32,'Load replay',chooseReplayFile);
    if(replayUiMessage) text(replayUiMessage,52,487,11,'#ffe66d');
    text('10 WAVES  /  AUTOMATIC FIRE  /  THREE WEAPON LINES',200,463,10,'#7e9586','left','600');
    rosterSpecimen(1,745,265,300);rosterSpecimen(0,645,393,118);rosterSpecimen(2,843,390,130);
    text('CONTACTS CONFIRMED',745,466,10,'#bbab78','center','600');
  }
  if (S.phase === 'over') {
    ctx.fillStyle = 'rgba(21,24,32,0.9)'; ctx.fillRect(0, 0, W, H);
    text(S.win ? 'Node secured. Ring One holds.' : 'The Gate has fallen.', W/2, 175, 26, S.win ? '#7cffb2' : '#ff6b6b', 'center', '700');
    if (S.win) {
      const n = S.gate >= GATE_MAX ? 3 : S.gate >= GATE_MAX * 0.7 ? 2 : 1;   // purity by Gate HP
      stars(n, W/2, 225, 30);
      text('Gate ' + S.gate + '/' + GATE_MAX + '  —  ' + (n === 3 ? 'Clean sweep. Not one got through.' : n === 2 ? 'Held with scratches.' : 'Held. Barely.'),
           W/2, 262, 14, '#c9d0dc', 'center');
    }
    text('Waves ' + S.wave + '/' + WAVES + '   Kills ' + S.kills + '   Credits left ' + S.credits, W/2, S.win ? 292 : 245, 15, '#c9d0dc', 'center');
    text(S.win ? 'DISPATCH: Held. All of it. — H.' : 'DISPATCH: Gate lost. Composition noted. Next time. — H.', W/2, S.win ? 318 : 275, 14, '#8a93a6', 'center');
    if(replay.mode==='finished') {
      btn(W/2 - 150, S.win ? 350 : 320, 140, 36, 'Save replay',saveReplayFile,true,true);
      btn(W/2 + 10, S.win ? 350 : 320, 140, 36, 'Play again',()=>{reset();beginReplayRecording();},true,true);
    }
    else if(replay.mode==='verified'||replay.mode==='error') btn(W/2 - 70, S.win ? 350 : 320, 140, 36, 'Back to menu',()=>reset(),true,true);
    else btn(W/2 - 70, S.win ? 350 : 320, 140, 36, 'Play again', () => { reset(); beginReplayRecording(); }, true, true);
    const replayLine=replayUiMessage||(replay.mode==='verified'?'Replay verified.':replay.mode==='playing'?'Replaying saved result…':replay.mode==='error'?replay.error:'');
    if(replayLine) text(replayLine,W/2,S.win?404:374,12,replay.mode==='error'?'#ff6b6b':'#ffe66d','center');
  }
  // Reserve a clear gap after speed and before the Gate readout; keep the control above overlays.
  btn(850, 7, 54, 26, soundEnabled ? 'SFX on' : 'SFX off', toggleSound);
}

// ---------------------------------------------------------------- input
// Hover previews the build choice. A touch hold previews before purchase; releasing outside cancels.
canvas.addEventListener('pointermove',ev=>{
  const r=canvas.getBoundingClientRect(),x=(ev.clientX-r.left)/scale,y=(ev.clientY-r.top)/scale;
  const button=buttons.find(b=>b.placement&&x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h);
  if(button)placementPreview=button.placement;
});
canvas.addEventListener('pointerleave',()=>{placementPreview=null;});
canvas.addEventListener('pointerdown', ev => {
  const rect = canvas.getBoundingClientRect();
  const x = (ev.clientX - rect.left) / scale, y = (ev.clientY - rect.top) / scale;
  for (const b of buttons) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
    if(b.placement && ev.pointerType==='touch'){
      placementPreview=b.placement;
      if(b.enabled){pendingPlacement={button:b,id:ev.pointerId,scene:S};try{canvas.setPointerCapture?.(ev.pointerId);}catch(_){} }
      if(soundEnabled)audioGesture();return;
    }
    if (b.enabled) { b.fn(); if (soundEnabled) audioGesture(); } return;
  }
  if(['playing','verified','error'].includes(replay.mode)) return;
  if (S.phase !== 'build' && S.phase !== 'wave') return;
  let hit = null;
  for (const s of SLOTS) if (Math.hypot(s.x - x, s.y - y) < 26) { hit = s; break; }
  if (hit) S.selected = hit.tower ? {kind:'tower', tower:hit.tower} : {kind:'slot', slot:hit};
  else S.selected = null;
  audioGesture();
});

canvas.addEventListener('pointerup',ev=>{
  if(!pendingPlacement||pendingPlacement.id!==ev.pointerId)return;
  const pending=pendingPlacement;pendingPlacement=null;
  const r=canvas.getBoundingClientRect(),x=(ev.clientX-r.left)/scale,y=(ev.clientY-r.top)/scale,b=pending.button;
  if(S===pending.scene&&S.selected?.kind==='slot'&&S.selected.slot===b.placement.slot&&x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h)b.fn();
  try{canvas.releasePointerCapture?.(ev.pointerId);}catch(_){}
});
canvas.addEventListener('pointercancel',()=>{pendingPlacement=null;placementPreview=null;});

// ---------------------------------------------------------------- loop
let last = performance.now();
// The frame loop survives a renderer exception: the simulation keeps stepping, the first error is kept and shown on the
// canvas until reload, so a playtester sees a red strip with the stack instead of a silently frozen frame.
// update() is deliberately not guarded: a simulation that threw is a broken game and must not keep running unnoticed.
let renderFault = null;
function drawRenderFault() {
  ctx.setTransform(scale*dpr, 0, 0, scale*dpr, 0, 0); ctx.globalAlpha = 1; ctx.setLineDash([]);
  const lines = String(renderFault.stack || renderFault).split('\n').slice(0, 4);
  ctx.fillStyle = 'rgba(96,12,12,0.92)'; ctx.fillRect(0, 0, W, 16 + lines.length*14);
  text('RENDER ERROR — the game goes on, the picture may be incomplete. Copy the console and attach it with the report.', 8, 12, 11, '#ffd9d9', 'left', '700');
  lines.forEach((l, i) => text(l.trim().slice(0, 150), 8, 26 + i*14, 11, '#ffecec'));
}
function frame(now) {
  // Bound catch-up after a suspended tab; speed changes the tick count, never the tick size.
  const raw = Math.max(0, Math.min(0.25, (now - last) / 1000)); last = now;
  presentationTime += raw;
  presentationBursts = presentationBursts.filter(b => presentationTime - b.at < b.life);
  if(replay.mode==='playing'){
    replay.playbackBudget=Math.min(0.25,replay.playbackBudget+raw);
    while(replay.mode==='playing'&&prepareReplayTick()){
      const stepWallTime=SIM_STEP/S.speed;
      if(replay.playbackBudget+1e-9<stepWallTime) break;
      replay.playbackBudget=Math.max(0,replay.playbackBudget-stepWallTime); advanceReplayTick(true);
    }
  } else if(!['verified','error','finished'].includes(replay.mode)) update(raw * S.speed);
  syncGeneratorHum();
  try { draw(); }
  catch (err) { if (!renderFault) { renderFault = err; console.error(err); } }
  if (renderFault) drawRenderFault();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
