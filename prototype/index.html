<!DOCTYPE html>

<title>Ultimate TD — core loop prototype v0.4</title>
<style>
  :root { --ink: #101a1b; --mint: #a9d7bb; --brass: #d3ae68; }
  html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; background: #151820; box-shadow: 0 0 90px #000; }

<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
'use strict';
// v0.4: Voltaic line (chain lightning; a Carapacid in the way intercepts the bolt; lightning rods end the chain),
// Grounding (deterministic rods: every third spawn + every Carapacid), EXPERIMENTAL Dispersal (spawn spacing),
// three-column damage ledger with next-unused-counter selection.
// v0.3 changes: the Coordinator caste is removed; swarm evolution is a background schedule
// (EVOLUTION_WAVES) resolved by the dominant damage source and announced by Marsh between waves.
// v0.2: RA-style power gauge (fill + green/yellow/red + threshold notch + brownout flicker),
// fully automatic targeting (anti-overkill, cannon cluster shots, Leech auto-escalation),
// tower selling (60%, stripes burn, 1.5-2 s demolition, available mid-wave),
// star rating by Gate HP, Leech caste (generator drain, FEAST, Sated Waves),
// first swarm mutations with Marsh memoranda.
// ---------------------------------------------------------------- canvas
const W = 960, H = 540, HUD = 40, BOT = 34;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
// Opt-in geometry aid for presentation review; absent from normal play and the regression VM.
const DEBUG_HIT_BOUNDS = typeof location !== 'undefined' && new URLSearchParams(location.search).has('debugHitBounds');
// Balance presets for playtesting declared candidates (reports/balance-factors-v0.4.md). Selected only by URL:
// ?balance=parityA. No preset = the campaign rules exactly. A preset is part of the replay fingerprint and is written
// into exported replays, so candidate games never mix with the baseline reference set. Delete a preset once it is
// accepted into the rules or rejected.
const BALANCE_PRESETS = {
  parityA: {label:'parity A', turretDmg:8.5, voltaicDmg:17, cannonDmg:40, enemyHp:1.25}
};
const BALANCE_PRESET_NAME = (() => { if (typeof location === 'undefined') return null;
  const n = new URLSearchParams(location.search).get('balance'); return BALANCE_PRESETS[n] ? n : null; })();
const BALANCE_PRESET = BALANCE_PRESET_NAME ? BALANCE_PRESETS[BALANCE_PRESET_NAME] : null;
// The preset is applied to ENEMY/TOWER values only (below), so simulation function sources stay untouched and the
// rules fingerprint changes through the values themselves: baseline replays keep verifying without a preset.
let evolutionCardDismissed = false;
const leechDrainVisuals = new WeakMap();
let scale = 1, dpr = 1;
function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  canvas.style.width = Math.round(W * scale) + 'px';
  canvas.style.height = Math.round(H * scale) + 'px';
}
addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------- path
const PATH = [[-30,90],[180,90],[180,270],[420,270],[420,120],[660,120],[660,420],[900,420],[1000,420]];
const SEG = []; let TOTAL = 0;
for (let i = 0; i < PATH.length - 1; i++) {
  const [x1,y1] = PATH[i], [x2,y2] = PATH[i+1];
  const L = Math.hypot(x2-x1, y2-y1);
  SEG.push({x1,y1,x2,y2,L,start:TOTAL});
  TOTAL += L;
}
const GATE_D = TOTAL - 70;               // enemies leak when they reach the Gate
const GATE = {x: 930, y: 420};
function posAt(d) {
  if (d <= 0) return {x: PATH[0][0], y: PATH[0][1]};
  for (const s of SEG) if (d <= s.start + s.L) {
    const t = (d - s.start) / s.L;
    return {x: s.x1 + (s.x2-s.x1)*t, y: s.y1 + (s.y2-s.y1)*t};
  }
  const e = PATH[PATH.length-1]; return {x: e[0], y: e[1]};
}

// ---------------------------------------------------------------- build slots
const SLOTS = [[110,160],[250,160],[350,200],[350,340],[250,340],[490,190],[490,330],[590,70],
  [590,200],[590,350],[730,200],[730,340],[820,340],[820,490],[350,70],[890,300]]
  .map(([x,y]) => ({x, y, tower: null}));

// ---------------------------------------------------------------- data
const ENEMY = {
  forager:     {name:'Forager',     hp:30,  speed:52, r:7,  bounty:5,  gateDmg:1, color:'#ff6b6b'},
  carapacid:   {name:'Carapacid',   hp:340, speed:34, r:18, bounty:40, gateDmg:5, color:'#a83232'},
  leech:       {name:'Leech',       hp:130, speed:46, r:10, bounty:25, gateDmg:2, color:'#c77dff'}
};
const TOWER = {
  turret:    {name:'Turret',    cost:60,  power:10,  range:130, dmg:7,  interval:0.28, kind:'flat', color:'#8fd3ff',
              upg:[0,50,90],  desc:'Flat fire. Blocked by Carapacid shadow.'},
  cannon:    {name:'Cannon',    cost:110, power:20,  range:190, minRange:70, dmg:45, splash:48, interval:1.7, kind:'arc', color:'#ffb454',
              upg:[0,80,140], desc:'Arcing splash. Ignores shadow. Dead zone up close.'},
  voltaic:   {name:'Voltaic',   cost:95,  power:18,  range:120, dmg:14, hops:3, hopRange:70, hopFalloff:0.7, interval:0.6, kind:'electro', color:'#9df7ff',
              upg:[0,70,120], desc:'Chain lightning. The bolt jumps to nearby bodies; a Carapacid in the way takes it first; lightning rods end the chain.'},
  generator: {name:'Generator', cost:90,  power:-40, kind:'gen', color:'#ffe66d',
              upg:[0,55,85],  desc:'+40/+60/+85 power. Leeches feed on it.'}
};
const GEN_POWER = [40, 60, 85];
if (BALANCE_PRESET) { TOWER.turret.dmg = BALANCE_PRESET.turretDmg; TOWER.voltaic.dmg = BALANCE_PRESET.voltaicDmg; TOWER.cannon.dmg = BALANCE_PRESET.cannonDmg;
  for (const k in ENEMY) ENEMY[k].hp = Math.round(ENEMY[k].hp * BALANCE_PRESET.enemyHp * 100) / 100; }                   // generator output by level: slot-efficient, not credit-efficient
const BASE_POWER = 40, PAUSED_DRAW = 0.25, WARMUP = 2.5, BROWNOUT_MULT = 0.6, WAVES = 10;
const RANK_KILLS = [0, 12, 35];
const SELL_RATE = 0.6, SELL_TIME = 1.8;          // 60% refund, 1.8 s demolition
const GATE_MAX = 20;
const SIM_STEP = 1 / 60;                         // combat advances in identical ticks at every display refresh rate
const ESCORT_WAVES = [4, 8];                      // wave composition: a shielded push, independent of evolution
const EVOLUTION_WAVES = [4, 8];                   // the swarm evolves after these waves; the next wave carries it
const MUT_STACK_CAP = 2;                          // prototype stack limit
const SPRINTER_DASH_MULT = 1.7;                   // approved campaign value
const MUT = {
  keratin:  {name:'Keratinization', vs:'flat',
             effect:'New specimens present keratinized plating. Kinetic damage −30%.', cause:'your kinetic fire dominance'},
  sprinter: {name:'Sprinter Reflex', vs:'arc',
             effect:'New specimens accelerate at shell-whistle.', cause:'your artillery dominance'},
  dispersal: {name:'Dispersal', vs:'arc',
             effect:'New specimens keep their distance from each other; fewer bodies share a blast.', cause:'your artillery dominance'},
  grounding: {name:'Grounding', vs:'electro',
             effect:'Lightning-rod specimens with conductive skeletons intercept the discharge; the chain ends on them.', cause:'your voltaic dominance'}
};
// Counters per weapon line, in the order the incubators try them. The dominant line gets its next unused counter;
// only when that line has nothing left does the swarm fall back to another line (reported as a replacement).
const COUNTERS = {flat:['keratin'], arc:['sprinter','dispersal'], electro:['grounding']};
const LEDGER_ORDER = ['flat', 'arc', 'electro'];      // tie-break: kinetic first, then artillery, then voltaic
const ROD_EVERY = 3;                                   // Grounding: every third spawn of a grounded wave is a rod; every Carapacid is
const DISPERSAL_SPACING = 1.5;                         // EXPERIMENTAL: Dispersal stretches spawn intervals; speed untouched. Measure wave duration.
// The report separates what changed (effect) from why (cause). A replacement is explained as such:
// the ledger never blames a weapon the player did not fire.
const REPLACEMENT_CAUSE = 'the counter to your dominant weapon is already present; the incubators have produced another adaptation';
function evolutionMemo(kind, replacement) {
  return 'MEMORANDUM (Marsh): ' + MUT[kind].effect + ' Cause: ' + (replacement ? REPLACEMENT_CAUSE : MUT[kind].cause) + '. — G.M.';
}

// ---------------------------------------------------------------- state
let S;
let presentationTime = 0, weaponFeedback = new WeakMap(), presentationBursts = [];
const REPLAY_LIMIT = 5 * 1024 * 1024, REPLAY_EVENT_LIMIT = 20000, REPLAY_TICK_LIMIT = 1000000;
let replay = {mode:'idle', tick:0, seq:0, events:[], checkpoints:[], error:null, initial:null, terminal:null, playbackBudget:0, nextEvent:0,nextCheckpoint:0,generations:Array(SLOTS.length).fill(0)};
let replayUiMessage='', replayLoading=false, replayLoadTicket=0;
function reset() {
  evolutionCardDismissed = false;
  for (const s of SLOTS) s.tower = null;
  S = {credits:200, gate:GATE_MAX, wave:0, phase:'menu', buildTimer:0, enemies:[], towers:[], shots:[], shells:[], fx:[],
       spawnQueue:[], spawnTimer:0, speed:1, selected:null, report:'', kills:0, waveKills:0, waveLeaked:0, time:0, win:false,
       dmg:{flat:0, arc:0, electro:0}, mutations:[], feast:0, stolen:0, spawnedThisWave:0,
       toast:'', toastT:0, accumulator:0};
  weaponFeedback = new WeakMap(); presentationBursts = []; presentationTime = 0;
  replay = {mode:'idle', tick:0, seq:0, events:[], checkpoints:[], error:null, initial:null, terminal:null, playbackBudget:0, nextEvent:0,nextCheckpoint:0,generations:Array(SLOTS.length).fill(0)};
  replayLoading=false; replayLoadTicket++; replayUiMessage='';
}
reset();

function toast(msg) { S.toast = msg; S.toastT = 5; }

// Optional synthesized presentation audio. The context is created only by a user gesture.
let soundEnabled = true, audioContext = null, activeVoices = 0, lastCueAt = Object.create(null);
let generatorHum = null, generatorHumGain = null, humMode = '';
const MAX_AUDIO_VOICES = 6;
function audioGesture() {
  if (!soundEnabled || document.hidden) return;
  const AudioCtor = window.AudioContext || window.webkitAudioContext;
  if (!AudioCtor) return;
  try { if (!audioContext) audioContext = new AudioCtor(); if (audioContext.state === 'suspended') audioContext.resume().catch(() => {}); syncGeneratorHum(); }
  catch (_) { audioContext = null; generatorHum = generatorHumGain = null; humMode = ''; }
}
function syncGeneratorHum() {
  if (!audioContext || audioContext.state !== 'running' || !soundEnabled || document.hidden) return;
  const gens = S ? S.towers.filter(t => t.type === 'generator' && !t.selling) : [];
  const powered = gens.filter(t => !isDrained(t)).length, drained = gens.length - powered;
  const mode = powered + ':' + drained;
  if (mode === humMode) return;
  humMode = mode;
  if (!gens.length) {
    if (generatorHum) { try { generatorHum.stop(); generatorHum.disconnect(); generatorHumGain.disconnect(); } catch (_) {} }
    generatorHum = generatorHumGain = null; return;
  }
  try {
    if (!generatorHum) {
      generatorHum = audioContext.createOscillator(); generatorHumGain = audioContext.createGain();
      generatorHum.type = 'sine'; generatorHum.frequency.setValueAtTime(58, audioContext.currentTime);
      generatorHumGain.gain.setValueAtTime(0.0001, audioContext.currentTime);
      generatorHum.connect(generatorHumGain); generatorHumGain.connect(audioContext.destination); generatorHum.start();
    }
    const now = audioContext.currentTime, level = powered ? Math.min(0.012, 0.005 + powered * 0.002) : 0.0001;
    generatorHumGain.gain.cancelScheduledValues(now); generatorHumGain.gain.setTargetAtTime(level, now, drained ? 0.035 : 0.12);
  } catch (_) {
    try { if (generatorHum) generatorHum.stop(); } catch (_) {}
    try { if (generatorHum) generatorHum.disconnect(); } catch (_) {}
    try { if (generatorHumGain) generatorHumGain.disconnect(); } catch (_) {}
    generatorHum = generatorHumGain = null; humMode = '';
  }
}
function playCue(kind, frequency, duration, wave = 'sine') {
  if (!soundEnabled || document.hidden || !audioContext || audioContext.state !== 'running' || activeVoices >= MAX_AUDIO_VOICES) return;
  const now = audioContext.currentTime;
  if (now - (lastCueAt[kind] ?? -Infinity) < 0.045) return;
  lastCueAt[kind] = now;
  let reserved = false, osc = null, gain = null;
  try {
    osc = audioContext.createOscillator(); gain = audioContext.createGain();
    osc.type = wave; osc.frequency.setValueAtTime(frequency, now);
    gain.gain.setValueAtTime(0.0001, now); gain.gain.exponentialRampToValueAtTime(0.055, now + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    osc.connect(gain); gain.connect(audioContext.destination);
    osc.onended = () => { activeVoices = Math.max(0, activeVoices - 1); try { osc.disconnect(); gain.disconnect(); } catch (_) {} };
    activeVoices++; reserved = true; osc.start(now); osc.stop(now + duration + 0.01);
  } catch (_) {
    if (reserved) activeVoices = Math.max(0, activeVoices - 1);
    try { if (osc) { osc.stop(); osc.disconnect(); } if (gain) gain.disconnect(); } catch (_) {}
    /* Audio is an optional enhancement; unsupported output is silent. */
  }
}
function playWeaponCue(kind) {
  if (kind === 'turret') playCue(kind, 210, 0.045, 'square');
  else if (kind === 'cannon') playCue(kind, 88, 0.19, 'triangle');
  else if (kind === 'voltaic') playCue(kind, 520, 0.12, 'sawtooth');
}
function toggleSound() {
  soundEnabled = !soundEnabled;
  if (!soundEnabled && audioContext) {
    if (generatorHum) { try { generatorHum.stop(); generatorHum.disconnect(); generatorHumGain.disconnect(); } catch (_) {} generatorHum = generatorHumGain = null; }
    humMode = ''; audioContext.suspend().catch(() => {});
  } else if (soundEnabled) audioGesture();
}
document.addEventListener?.('visibilitychange', () => {
  if (!audioContext) return;
  try { if (document.hidden) audioContext.suspend(); } catch (_) {}
});

function waveDef(n) {
  let f = 8 + 4*n; const caras = n >= 2 ? Math.floor(n/2) : 0; const list = [];
  for (let i = 0; i < caras; i++) {
    list.push({type:'carapacid', delay:1.4});
    for (let j = 0; j < 6 && f > 0; j++) { list.push({type:'forager', delay:0.45}); f--; }
  }
  while (f > 0) { list.push({type:'forager', delay:0.55}); f--; }
  const leeches = n >= 5 ? 1 + Math.floor((n - 5) / 2) : 0;   // Leeches from wave 5
  for (let i = 0; i < leeches; i++) list.splice(3 + i*5, 0, {type:'leech', delay:1.0});
  if (ESCORT_WAVES.includes(n)) {                             // shielded push; kept separate so a silenced schedule still plays the same waves
    const convoy = [{type:'carapacid', delay:1.6},
                    {type:'forager', delay:0.4}, {type:'forager', delay:0.4},
                    {type:'forager', delay:0.4}, {type:'forager', delay:0.4}];
    list.splice(Math.floor(list.length * 0.4), 0, ...convoy); // mid-wave: the stream ahead soaks the targeting
  }
  return list;
}
function previewText(n) {
  const d = waveDef(n); const c = {};
  for (const s of d) c[s.type] = (c[s.type]||0) + 1;
  let t = Object.keys(c).map(k => ENEMY[k].name + ' ×' + c[k]).join(', ');
  const sated = satedBonus();
  if (sated > 0) t += '   [SATED +' + Math.round(sated*100) + '% HP]';
  if (S.mutations.length) t += '   [MUT: ' + S.mutations.map(m => MUT[m].name).join(', ') + ']';
  return t;
}
function satedBonus() { return Math.min(0.25, 0.02 * S.stolen); }   // Sated Waves: stolen power feeds future waves
function makeEnemy(type, n) {
  const T = ENEMY[type]; const mul = (1 + 0.08*(n-1)) * (1 + satedBonus());
  const muts = [...S.mutations];
  const index = S.spawnedThisWave++;                             // deterministic: no randomness in the simulation
  const rod = muts.includes('grounding') && (type === 'carapacid' || index % ROD_EVERY === ROD_EVERY - 1);
  return {type, T, hp:T.hp*mul, maxHp:T.hp*mul, d:0, speed:T.speed, effSpeed:T.speed, r:T.r,
          x:PATH[0][0], y:PATH[0][1], dead:false, incoming:0, dash:0,
          muts, rod, state:'lane', gen:null, feedT:0};
}
function tstats(t) {
  const T = t.T, lv = t.level;
  return {dmg: T.dmg * Math.pow(1.35, lv-1), range: T.range + 15*(lv-1),
          interval: T.interval * (lv === 3 ? 0.85 : 1), power: T.power + 5*(lv-1),
          hops: (T.hops || 0) + (lv === 3 ? 1 : 0)};
}
function rank(t) { return t.kills >= RANK_KILLS[2] ? 2 : t.kills >= RANK_KILLS[1] ? 1 : 0; }
function isDrained(t) { return !!(t.leeched && !t.leeched.dead && t.leeched.state === 'attached'); }
function power() {
  let prod = BASE_POWER, cons = 0;
  for (const t of S.towers) {
    if (t.selling) continue;                                   // demolition crew has cut the feed
    if (t.type === 'generator') { if (!isDrained(t)) prod += GEN_POWER[t.level-1]; }  // approach reserves the generator; only feeding cuts power
    else { const p = tstats(t).power; cons += t.paused ? p*PAUSED_DRAW : p; }
  }
  return {prod, cons, brown: cons > prod};
}

// ---------------------------------------------------------------- actions
function startWave() {
  S.wave++; S.phase = 'wave'; S.spawnQueue = waveDef(S.wave); S.spawnTimer = 0.6;
  S.waveKills = 0; S.waveLeaked = 0; S.selected = null; S.spawnedThisWave = 0;
  // EXPERIMENTAL Dispersal: the mutated wave leaves the mouth less densely. Composition and speed are unchanged;
  // the wave lasts longer, which may also help the defense — the paired control must measure wave duration.
  if (S.mutations.includes('dispersal')) for (const s of S.spawnQueue) s.delay *= DISPERSAL_SPACING;
  return true;
}
function endWave() {
  let memo = '';
  // Background evolution: the incubators read the damage ledger on schedule, with no organism on the lane.
  if (EVOLUTION_WAVES.includes(S.wave) && S.wave < WAVES && S.mutations.length < MUT_STACK_CAP) {
    const ledger = LEDGER_ORDER.map(k => [k, S.dmg[k] || 0]).sort((a, b) => b[1] - a[1] || LEDGER_ORDER.indexOf(a[0]) - LEDGER_ORDER.indexOf(b[0]));
    const nextUnused = line => (COUNTERS[line] || []).find(m => !S.mutations.includes(m));
    let kind = nextUnused(ledger[0][0]), replacement = false;      // the dominant line gets its next unused counter
    if (!kind) {                                                    // nothing left against the dominant line:
      replacement = true;                                           // fall back to the next line by ledger, reported as a replacement
      for (const [line] of ledger.slice(1)) { kind = nextUnused(line); if (kind) break; }
    }
    if (kind && !S.mutations.includes(kind)) {
      S.mutations.push(kind); S.dmg = {flat:0, arc:0, electro:0};  // the ledger window restarts at every mutation
      memo = evolutionMemo(kind, replacement);
      evolutionCardDismissed = false;
      toast('EVOLUTION: ' + MUT[kind].name + ' next wave. Prepare your defense.');
    }
  }
  S.report = memo || ('DISPATCH ' + S.wave + ': Wave held. Kills ' + S.waveKills + '. Leaked ' + S.waveLeaked + '.' +
             (S.waveLeaked ? ' Tighten the lane.' : ''));
  if (S.wave >= WAVES) { S.phase = 'over'; S.win = true; return; }
  S.phase = 'build'; S.buildTimer = 20;
}
function build(slot, type) {
  const T = TOWER[type]; if (!T || !slot || slot.tower || S.credits < T.cost) return false;
  S.credits -= T.cost;
  const t = {type, T, x:slot.x, y:slot.y, level:1, paused:false, warm:0, cd:0, kills:0, angle:-Math.PI/2, slot,
             invested:T.cost, selling:false, sellT:0, leeched:null};
  slot.tower = t; S.towers.push(t); S.selected = {kind:'tower', tower:t};
  if (type === 'generator') playCue('generator', 310, 0.24, 'sine');
  return true;
}
function upgrade(t) {
  if (!t || t.level >= 3 || t.selling) return false;
  const cost = t.T.upg[t.level]; if (S.credits < cost) return;
  S.credits -= cost; t.level++; t.invested += cost;
  if (t.type === 'generator') playCue('generator', 390, 0.2, 'sine');
  return true;
}
function togglePause(t) {
  if (!t || t.type === 'generator' || t.selling) return false;
  if (t.paused) { t.paused = false; t.warm = WARMUP; } else { t.paused = true; }
  return true;
}
function returnLeechToLane(e) {
  if (e.gen) e.gen.leeched = null;
  e.gen = null;
  e.state = 'return';
  let best = Infinity;
  for (const s of SEG) {
    const u = Math.max(0, Math.min(1, ((e.x-s.x1)*(s.x2-s.x1) + (e.y-s.y1)*(s.y2-s.y1)) / (s.L*s.L)));
    const x = s.x1 + (s.x2-s.x1)*u, y = s.y1 + (s.y2-s.y1)*u;
    const distance = Math.hypot(e.x-x, e.y-y);
    if (distance < best) { best = distance; e.returnD = Math.min(GATE_D, s.start + s.L*u); }
  }
}
function sell(t) {                                              // demolition: fire stops now, credits on completion
  if (!t || t.selling) return false;
  t.selling = true; t.sellT = SELL_TIME;
  if (t.leeched) returnLeechToLane(t.leeched);
  S.selected = null;
  return true;
}
function replayRulesFingerprint() {
  const rules = {SIM_STEP, PATH, SLOTS:SLOTS.map(s=>[s.x,s.y]), ENEMY, TOWER, GEN_POWER, BASE_POWER, PAUSED_DRAW, WARMUP,
    BROWNOUT_MULT,WAVES,RANK_KILLS,SELL_RATE,SELL_TIME,GATE_MAX,ESCORT_WAVES,EVOLUTION_WAVES,MUT_STACK_CAP,SPRINTER_DASH_MULT,
    MUT,COUNTERS,LEDGER_ORDER,ROD_EVERY,DISPERSAL_SPACING,GATE_D};
  return replayHash(JSON.stringify(rules));
}
function replayHash(value) {
  let h = 2166136261;
  for (let i=0;i<value.length;i++) { h ^= value.charCodeAt(i); h = Math.imul(h,16777619); }
  return (h>>>0).toString(16).padStart(8,'0');
}
function replaySourceFingerprint() {
  const sources=[reset,evolutionMemo,posAt,waveDef,satedBonus,makeEnemy,tstats,rank,isDrained,power,startWave,endWave,build,upgrade,togglePause,
    returnLeechToLane,sell,finishSell,damage,segHitsCircle,pickTarget,fireFlat,fireArc,fireElectro,update,stepSimulation,performPlayerAction];
  return replayHash(sources.map(fn=>fn.toString()).join('\n'));
}
function replaySignature() {
  return JSON.stringify({tick:replay.tick,win:!!S.win,gate:S.gate,credits:S.credits,wave:S.wave,kills:S.kills,mutations:S.mutations.slice(),
    dmg:S.dmg,time:S.time,towers:SLOTS.map((s,i)=>{const t=s.tower; return t?{slot:i,type:t.type,generation:replay.generations[i],level:t.level,paused:t.paused,

      const x=t.x+Math.cos(feedback.angle)*27, y=t.y+Math.sin(feedback.angle)*27;
      ctx.globalAlpha=1-age/0.065;ctx.fillStyle='#fff0ad';ctx.beginPath();ctx.arc(x,y,2.5+3*(1-age/0.065),0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
    }
  }
  for (const b of presentationBursts) {
    const age = presentationTime - b.at, k = 1 - age / b.life;
    if (k <= 0 || k > 1) continue;
    ctx.save(); ctx.globalAlpha = Math.max(0, k);
    if (b.kind === 'casing') {
      const d = age * 30;
      ctx.fillStyle='#e8bb62'; ctx.beginPath(); ctx.ellipse(b.x + Math.cos(b.angle+1.9)*d, b.y + Math.sin(b.angle+1.9)*d + age*age*24, 2, 1, b.angle, 0, Math.PI*2); ctx.fill();
    } else if (b.kind === 'cannonMuzzle') {
      const x=b.x+Math.cos(b.angle)*24, y=b.y+Math.sin(b.angle)*24;
      ctx.fillStyle='#ffd27f';ctx.beginPath();ctx.arc(x,y,5*k+1,0,Math.PI*2);ctx.fill();
    } else if (b.kind === 'impactDust') {
      ctx.strokeStyle='#d7c3a0';ctx.lineWidth=2;
      for (let i=0;i<3;i++) { const a=i*Math.PI*2/3; ctx.beginPath();ctx.arc(b.x+Math.cos(a)*(1-k)*12,b.y+Math.sin(a)*(1-k)*7,3+(1-k)*5,0,Math.PI*2);ctx.stroke(); }
    }
    ctx.restore();
  }
  // The vector Voltaic charges between discharges and blooms briefly on each actual chain event.
  for (const t of S.towers) if (t.type === 'voltaic') {
    const feedback=weaponFeedback.get(t), age=feedback ? presentationTime-feedback.at : Infinity;
    if (age < 0.16) { ctx.globalAlpha=1-age/0.16;ctx.strokeStyle='#d5ffff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(t.x,t.y,17+age*38,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1; }
  }
  // enemies
  for (const e of S.enemies) {
    enemyArt(e);
    if (e.type === 'leech') drawLeechCue(e);
    if (e.type === 'leech' && e.state === 'attached') { ctx.strokeStyle = '#c77dff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 3 + 2*Math.sin(S.time*8), 0, Math.PI*2); ctx.stroke(); }
    if (e.muts.includes('keratin')) { ctx.strokeStyle = '#9aa3b5'; ctx.lineWidth = 2;    // matte plating marker
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 2, 0, Math.PI*2); ctx.stroke(); }
    if (e.muts.includes('sprinter')) {                                                   // motion streak marker
      ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(e.x - e.r - 8, e.y - 3); ctx.lineTo(e.x - e.r - 2, e.y - 3);
      ctx.moveTo(e.x - e.r - 8, e.y + 3); ctx.lineTo(e.x - e.r - 2, e.y + 3); ctx.stroke();
    }
    if (e.rod) {                                                                         // Grounding: copper veins
      ctx.strokeStyle = '#e0a060'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(e.x - e.r*0.7, e.y - e.r*0.5); ctx.lineTo(e.x + e.r*0.2, e.y + e.r*0.1); ctx.lineTo(e.x + e.r*0.7, e.y - e.r*0.4);
      ctx.moveTo(e.x - e.r*0.4, e.y + e.r*0.6); ctx.lineTo(e.x + e.r*0.5, e.y + e.r*0.5); ctx.stroke();
    }
    if (e.muts.includes('dispersal')) { ctx.strokeStyle = 'rgba(255,174,66,0.45)'; ctx.lineWidth = 1; ctx.setLineDash([3, 4]);  // Dispersal: spacing halo
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 7, 0, Math.PI*2); ctx.stroke(); ctx.setLineDash([]); }
    if (e.hp < e.maxHp) { const w = e.r*2+6; ctx.fillStyle = '#101218'; ctx.fillRect(e.x-w/2, e.y-e.r-9, w, 4);
      ctx.fillStyle = '#7cffb2'; ctx.fillRect(e.x-w/2, e.y-e.r-9, w*(e.hp/e.maxHp), 4); }
  }
  if (DEBUG_HIT_BOUNDS) {
    // These rings mirror the geometry used by targeting/interception and shell impact checks.
    for (const e of S.enemies) {
      if (e.dead) continue;
      ctx.save(); ctx.lineWidth = 1.25;
      ctx.strokeStyle = '#f4f1df'; ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI*2); ctx.stroke(); // body radius
      if (e.type === 'carapacid') {
        ctx.strokeStyle = '#75e1ee'; ctx.setLineDash([3, 3]);
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 3, 0, Math.PI*2); ctx.stroke(); // line interception
      }
      ctx.restore();
    }
    for (const sh of S.shells) {
      ctx.save(); ctx.strokeStyle = '#ffb454'; ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]);
      ctx.beginPath(); ctx.arc(sh.tx, sh.ty, sh.splash, 0, Math.PI*2); ctx.stroke(); // blast radius; hit test adds half each body's radius
      ctx.restore();
    }
    ctx.fillStyle = '#111820e8'; roundRect(12, H - BOT - 25, 460, 18, 3); ctx.fill();
    text('DEBUG  body r   |   Carapacid intercept r + 3   |   shell hit radius = splash + e.r*0.5', 20, H - BOT - 16, 9, '#e6e2cf');
  }
  // shots / shells / fx
  for (const s of S.shots) {
    if (s.electro) {                                             // jagged bolt: presentation-only jitter from time and endpoints
      ctx.strokeStyle = s.blocked ? '#ff9f43' : '#9df7ff'; ctx.lineWidth = 2; ctx.globalAlpha = Math.max(0, s.life / 0.12);
      const dx = s.x2 - s.x1, dy = s.y2 - s.y1, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
      ctx.beginPath(); ctx.moveTo(s.x1, s.y1);
      for (let i = 1; i < 5; i++) { const k = i / 5, j = Math.sin(S.time * 40 + i * 2.1 + s.x1) * 5; ctx.lineTo(s.x1 + dx*k + nx*j, s.y1 + dy*k + ny*j); }
      ctx.lineTo(s.x2, s.y2); ctx.stroke(); ctx.globalAlpha = 1; continue;
    }
    ctx.strokeStyle = s.blocked ? '#ff9f43' : '#ffffff'; ctx.lineWidth = s.blocked ? 2.5 : 1.5;
    ctx.globalAlpha = Math.max(0, s.life / 0.09); ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke(); ctx.globalAlpha = 1; }
  for (const sh of S.shells) { const k = sh.t / sh.flight; const x = sh.sx + (sh.tx-sh.sx)*k, y = sh.sy + (sh.ty-sh.sy)*k - Math.sin(k*Math.PI)*70;
    ctx.fillStyle = '#ffd27f'; ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,174,66,0.25)'; ctx.beginPath(); ctx.arc(sh.tx, sh.ty, 6, 0, Math.PI*2); ctx.fill(); }
  for (const f of S.fx) { const k = f.life / f.max; ctx.globalAlpha = k; ctx.strokeStyle = f.color; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (f.kind === 'boom' ? 1 : (1.6 - k)), 0, Math.PI*2); ctx.stroke(); ctx.globalAlpha = 1; }

  // brownout overlay
  if (pw.brown && S.phase === 'wave') {
    ctx.fillStyle = 'rgba(0,0,0,' + (0.32 + 0.06*Math.sin(S.time*18)) + ')'; ctx.fillRect(0, HUD, W, H - HUD - BOT);
    text('BROWNOUT — towers fire 40% slower', W/2, HUD + 18, 14, '#ff6b6b', 'center', '700');
  }
  // FEAST banner
  if (S.feast > 0 && S.phase === 'wave') text('THE SWARM FEASTS ×' + S.feast, W/2, HUD + 40, 15, '#c77dff', 'center', '800');

  // HUD
  ctx.fillStyle = '#101e1cf5'; ctx.fillRect(0, 0, W, HUD); ctx.fillRect(0, H - BOT, W, BOT);
  ctx.fillStyle='#6c8261';ctx.fillRect(0,HUD-1,W,1);ctx.fillRect(0,H-BOT,W,1);
  text('Credits ' + S.credits, 14, HUD/2, 15, '#ffe66d', 'left', '700');
  // power bar — Red Alert fill and color logic: green surplus, yellow near threshold, red deficit
  const bx = 170, bw = 220;
  text('Power', bx, HUD/2, 12, '#8a93a6', 'left', '600');
  ctx.fillStyle = '#2b3140'; roundRect(bx + 48, 12, bw, 16, 4); ctx.fill();
  const maxv = Math.max(pw.prod, pw.cons, 1);
  const ratio = pw.cons / Math.max(1, pw.prod);
  let barColor = '#7cffb2';                                    // green: comfortable surplus
  if (pw.brown) barColor = '#ff6b6b';                          // red: deficit
  else if (ratio >= 0.8) barColor = '#ffe66d';                 // yellow: nearing the threshold
  ctx.fillStyle = barColor;
  if (pw.brown) ctx.globalAlpha = 0.6 + 0.4 * Math.abs(Math.sin(S.time * 12));   // brownout flicker
  roundRect(bx + 48, 12, bw * Math.min(1, pw.cons / maxv), 16, 4); ctx.fill();
  ctx.globalAlpha = 1;
  const px = bx + 48 + bw * Math.min(1, pw.prod / maxv);       // threshold notch = production
  ctx.strokeStyle = '#e8ecf2'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(px, 8); ctx.lineTo(px, 32); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(px - 4, 8); ctx.lineTo(px, 12); ctx.lineTo(px + 4, 8); ctx.closePath();
  ctx.fillStyle = '#e8ecf2'; ctx.fill();
  text(pw.cons + ' / ' + pw.prod, bx + 48 + bw + 8, HUD/2, 12, pw.brown ? '#ff6b6b' : barColor, 'left', '600');
  text('Wave ' + S.wave + '/' + WAVES, 560, HUD/2, 14, '#e8ecf2', 'center', '700');
  if (BALANCE_PRESET) text('BALANCE: ' + BALANCE_PRESET.label, 560, HUD + 12, 11, '#ffb454', 'center', '700');
  if(['playing','verified','error'].includes(replay.mode)) btn(640,7,130,26,'Exit replay',()=>reset(),true,true);
  else if (S.phase === 'build') btn(640, 7, 130, 26, 'Send wave (' + Math.ceil(S.buildTimer) + ')', () => performPlayerAction({kind:'wave'}), true, true);
  if ((S.phase === 'build' || S.phase === 'wave')&&replay.mode!=='playing'&&replay.mode!=='verified') btn(786, 7, 60, 26, '×' + S.speed, () => performPlayerAction({kind:'speed',value:S.speed===1?2:1}));
  text('Gate ' + S.gate, 954, HUD/2, 14, S.gate > 6 ? '#7cffb2' : '#ff6b6b', 'right', '700');

  // bottom bar: a fresh toast wins over the standing line
  let bottom = '';
  if (S.toastT > 0) bottom = S.toast;
  else if (S.phase === 'build') bottom = 'Next wave: ' + previewText(S.wave + 1) + (S.report ? '     |     ' + S.report : '');
  else if (S.phase === 'wave') bottom = 'Wave ' + S.wave + ' in progress. Towers aim themselves. Tap one to pause, upgrade or sell it.';
  if(replay.mode==='error') bottom='REPLAY ERROR: '+replay.error+'  Use Exit replay to return to the menu.';
  wrappedText(bottom,14,H-BOT+10,W-28,2,S.toastT>0?'#ffe66d':'#c9d0dc');

  // Evolution is announced during the existing interwave build window; the card sits in unused lower-left terrain.
  if (S.phase === 'build' && S.report.startsWith('MEMORANDUM') && !evolutionCardDismissed) {
    const mutation = S.mutations[S.mutations.length - 1];
    const mutationNames = {keratin:'Keratinization', sprinter:'Sprinter Reflex', dispersal:'Dispersal', grounding:'Grounding'};
    const effect = {
      keratin:'Kinetic damage reduced by 30%.',
      sprinter:'New specimens accelerate at shell-whistle.',
      dispersal:'New specimens spread out; fewer share a blast.',
      grounding:'Rod specimens intercept lightning; the chain ends on them.'
    }[mutation] || 'New specimens carry an adaptation.';
    const x = 14, y = H - BOT - 63, w = 500, h = 56;
    ctx.fillStyle = '#111a1cf2'; ctx.strokeStyle = '#8b789d'; ctx.lineWidth = 1;
    roundRect(x, y, w, h, 4); ctx.fill(); ctx.stroke();
    // Same Forager body on both sides; the second specimen shows its mutation marker.
    evolutionBody(0, x + 23, y + 28, null);
    text('→', x + 46, y + 28, 13, '#c9d0dc', 'center', '700');
    evolutionBody(0, x + 67, y + 28, mutation);
    text('EVOLUTION  ' + (mutationNames[mutation] || 'Adaptation'), x + 88, y + 16, 10, '#e6d8f2', 'left', '700');
    text(effect, x + 88, y + 38, 10, '#d1d7df');
    if (mutation === 'grounding') {
      // A tiny animated chain ends at the copper-veined rod, matching the mutation's actual interaction.
      const pulse = (Math.sin(S.time * 8) + 1) * 0.5;
      ctx.strokeStyle = '#9df7ff'; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.45 + pulse * 0.55;
      ctx.beginPath(); ctx.moveTo(x+424,y+24); ctx.lineTo(x+442,y+31); ctx.stroke();
      ctx.globalAlpha = 1; ctx.strokeStyle = '#e0a060'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x+440,y+23); ctx.lineTo(x+445,y+29); ctx.lineTo(x+442,y+35); ctx.stroke();
    }
    btn(x + w - 25, y + 5, 20, 18, '×', () => { evolutionCardDismissed = true; });
  }

  // selection menus
  if (S.selected && (S.phase === 'build' || S.phase === 'wave')) {
    if (S.selected.kind === 'slot') {
      const s = S.selected.slot; const items = ['turret', 'cannon', 'voltaic', 'generator'];
      let x0 = Math.max(6, Math.min(W - 6 - 4*98, s.x - 196)); const y0 = s.y > H/2 ? s.y - 74 : s.y + 26;
      menuPanel(x0,y0,4);
        items.forEach((k, i) => { const T = TOWER[k];
        btn(x0 + i*98, y0, 92, 30, T.name + ' ' + T.cost, () => performPlayerAction({kind:'build',slot:SLOTS.indexOf(s),type:k}), S.credits >= T.cost); });
      wrappedText('Turret: rapid fire. Cannon: arcing splash. Voltaic: chain lightning, jumps between bodies. Generator: +40 power, upgradable to +85.',x0,y0+42,386);
    } else {
      const t = S.selected.tower; const st = tstats(t);
      let x0 = Math.max(6, Math.min(W - 6 - 3*98, t.x - 147)); const y0 = t.y > H/2 ? t.y - 74 : t.y + 26;
      menuPanel(x0,y0);
      if (t.selling) {
        text('Demolition in progress…', x0, y0 + 10, 12, '#8a93a6', 'left');
      } else if (t.type !== 'generator') {
        const towerIndex=SLOTS.indexOf(t.slot), towerRef={slot:towerIndex,type:t.type,generation:replay.generations[towerIndex]};
        btn(x0, y0, 92, 30, t.paused ? 'Resume' : 'Pause', () => performPlayerAction({kind:t.paused?'resume':'pause',...towerRef}));
        const cost = t.T.upg[t.level];
        btn(x0 + 98, y0, 92, 30, t.level < 3 ? 'Upgrade ' + cost : 'Max level', () => performPlayerAction({kind:'upgrade',...towerRef}), t.level < 3 && S.credits >= cost);
        btn(x0 + 196, y0, 92, 30, 'Sell ' + Math.round(t.invested * SELL_RATE), () => performPlayerAction({kind:'sell',...towerRef}));
        wrappedText(t.T.name + ' L' + t.level + '  dmg ' + Math.round(st.dmg) + '  power ' + (t.paused ? Math.round(st.power*PAUSED_DRAW) : st.power) +
             '  kills ' + t.kills + (rank(t) ? (rank(t) === 2 ? '  Elite (stripes burn on sale)' : '  Veteran (stripes burn on sale)') : ''), x0, y0 + 42, 288);
      } else {
        const cost = t.T.upg[t.level];
        const towerIndex=SLOTS.indexOf(t.slot), towerRef={slot:towerIndex,type:t.type,generation:replay.generations[towerIndex]};
        btn(x0, y0, 92, 30, t.level < 3 ? 'Upgrade ' + cost : 'Max level', () => performPlayerAction({kind:'upgrade',...towerRef}), t.level < 3 && S.credits >= cost);
        btn(x0 + 98, y0, 92, 30, 'Sell ' + Math.round(t.invested * SELL_RATE), () => performPlayerAction({kind:'sell',...towerRef}));
        wrappedText(isDrained(t) ? 'Generator: LEECHED — output 0. Nearby towers are on it.'
                       : 'Generator L' + t.level + ': +' + GEN_POWER[t.level-1] + ' power' + (t.level < 3 ? ' (next +' + GEN_POWER[t.level] + ')' : '') + '. Cannot be paused.',
             x0, y0 + 42, 288);
      }
    }
  }

  // overlays
  if (S.phase === 'menu') {
    const shade=ctx.createLinearGradient(0,0,W,0);shade.addColorStop(0,'#071411fa');shade.addColorStop(.58,'#071411e8');shade.addColorStop(1,'#07141144');
    ctx.fillStyle=shade;ctx.fillRect(0,0,W,H);
    text('THE EXPEDITION  /  FIELD OPERATIONS',52,80,11,'#b8bd8b','left','700');
    text('THE HUNGER',48,139,56,'#e0e7cc','left','900');
    text('HOLD THE LINE. LEARN WHAT COMES NEXT.',52,185,12,'#9bac91','left','600');
    ctx.fillStyle='#b9a866';ctx.fillRect(52,218,54,3);
    text('PERIMETER 07',52,256,22,'#d4dec4','left','700');
    text('Build your defense. Protect the generators.',52,291,15,'#afc1b2');
    text('The swarm adapts to your fire. Be ready to rebuild.',52,316,15,'#afc1b2');
    text('Tap a platform to build. Tap a tower to upgrade or sell.',52,351,12,'#8b9e91');
    btn(52,392,210,44,'DEPLOY GARRISON',()=>performPlayerAction({kind:'deploy'}),true,true);
    btn(52,444,130,32,'Load replay',chooseReplayFile);
    if(replayUiMessage) text(replayUiMessage,52,487,11,'#ffe66d');
    text('10 WAVES  /  AUTOMATIC FIRE  /  THREE WEAPON LINES',200,463,10,'#7e9586','left','600');
    sprite(1,745,265,300,-.3);sprite(0,645,393,118,.4);sprite(2,843,390,130,-.6);
    text('CONTACTS CONFIRMED',745,466,10,'#bbab78','center','600');
  }
  if (S.phase === 'over') {
    ctx.fillStyle = 'rgba(21,24,32,0.9)'; ctx.fillRect(0, 0, W, H);
    text(S.win ? 'Node secured. Ring One holds.' : 'The Gate has fallen.', W/2, 175, 26, S.win ? '#7cffb2' : '#ff6b6b', 'center', '700');
    if (S.win) {
      const n = S.gate >= GATE_MAX ? 3 : S.gate >= GATE_MAX * 0.7 ? 2 : 1;   // purity by Gate HP
      stars(n, W/2, 225, 30);
      text('Gate ' + S.gate + '/' + GATE_MAX + '  —  ' + (n === 3 ? 'Clean sweep. Not one got through.' : n === 2 ? 'Held with scratches.' : 'Held. Barely.'),
           W/2, 262, 14, '#c9d0dc', 'center');
    }
    text('Waves ' + S.wave + '/' + WAVES + '   Kills ' + S.kills + '   Credits left ' + S.credits, W/2, S.win ? 292 : 245, 15, '#c9d0dc', 'center');
    text(S.win ? 'DISPATCH: Held. All of it. — H.' : 'DISPATCH: Gate lost. Composition noted. Next time. — H.', W/2, S.win ? 318 : 275, 14, '#8a93a6', 'center');
    if(replay.mode==='finished') {
      btn(W/2 - 150, S.win ? 350 : 320, 140, 36, 'Save replay',saveReplayFile,true,true);
      btn(W/2 + 10, S.win ? 350 : 320, 140, 36, 'Play again',()=>{reset();beginReplayRecording();},true,true);
    }
    else if(replay.mode==='verified'||replay.mode==='error') btn(W/2 - 70, S.win ? 350 : 320, 140, 36, 'Back to menu',()=>reset(),true,true);
    else btn(W/2 - 70, S.win ? 350 : 320, 140, 36, 'Play again', () => { reset(); beginReplayRecording(); }, true, true);
    const replayLine=replayUiMessage||(replay.mode==='verified'?'Replay verified.':replay.mode==='playing'?'Replaying saved result…':replay.mode==='error'?replay.error:'');
    if(replayLine) text(replayLine,W/2,S.win?404:374,12,replay.mode==='error'?'#ff6b6b':'#ffe66d','center');
  }
  // Reserve a clear gap after speed and before the Gate readout; keep the control above overlays.
  btn(850, 7, 54, 26, soundEnabled ? 'SFX on' : 'SFX off', toggleSound);
}

// ---------------------------------------------------------------- input
canvas.addEventListener('pointerdown', ev => {
  const rect = canvas.getBoundingClientRect();
  const x = (ev.clientX - rect.left) / scale, y = (ev.clientY - rect.top) / scale;
  for (const b of buttons) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { if (b.enabled) { b.fn(); if (soundEnabled) audioGesture(); } return; }
  if(['playing','verified','error'].includes(replay.mode)) return;
  if (S.phase !== 'build' && S.phase !== 'wave') return;
  let hit = null;
  for (const s of SLOTS) if (Math.hypot(s.x - x, s.y - y) < 26) { hit = s; break; }
  if (hit) S.selected = hit.tower ? {kind:'tower', tower:hit.tower} : {kind:'slot', slot:hit};
  else S.selected = null;
  audioGesture();
});

// ---------------------------------------------------------------- loop
let last = performance.now();
function frame(now) {
  // Bound catch-up after a suspended tab; speed changes the tick count, never the tick size.
  const raw = Math.max(0, Math.min(0.25, (now - last) / 1000)); last = now;
  presentationTime += raw;
  presentationBursts = presentationBursts.filter(b => presentationTime - b.at < b.life);
  if(replay.mode==='playing'){
    replay.playbackBudget=Math.min(0.25,replay.playbackBudget+raw);
    while(replay.mode==='playing'&&prepareReplayTick()){
      const stepWallTime=SIM_STEP/S.speed;
      if(replay.playbackBudget+1e-9<stepWallTime) break;
      replay.playbackBudget=Math.max(0,replay.playbackBudget-stepWallTime); advanceReplayTick(true);
    }
  } else if(!['verified','error','finished'].includes(replay.mode)) update(raw * S.speed);
  syncGeneratorHum();
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
